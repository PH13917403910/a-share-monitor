<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>打开监测</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#12151c; color:#e7ecf5; font:16px/1.4 Georgia, serif; }
  form { width:min(360px, calc(100% - 32px)); display:grid; gap:10px; }
  input, button { font:inherit; padding:10px 12px; border-radius:10px; border:1px solid #2c3548; }
  input { background:#1c2230; color:inherit; }
  button { background:#d7c4a3; color:#1c2230; }
  p { min-height:1.4em; color:#e6c27a; }
</style>
</head>
<body>
<form id="gate">
  <label for="pass">口令</label>
  <input id="pass" type="password" autocomplete="current-password" required>
  <button type="submit">打开</button>
  <p id="msg"></p>
</form>
<script>
const ITERATIONS = 600000;
const STORE = "arisk-session-key";

function b64(bytes) {
  let s = "";
  bytes.forEach(b => { s += String.fromCharCode(b); });
  return btoa(s);
}
function unb64(text) {
  const bin = atob(text);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function derive(pass, salt) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: ITERATIONS, hash: "SHA-256" },
    base,
    { name: "AES-GCM", length: 256 },
    true,
    ["decrypt"]
  );
}
async function openWithKey(raw, key) {
  const salt = raw.slice(0, 16);
  const iv = raw.slice(16, 28);
  const body = raw.slice(28);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, body);
  const html = new TextDecoder().decode(plain);
  sessionStorage.setItem(STORE, b64(new Uint8Array(await crypto.subtle.exportKey("raw", key))));
  document.open();
  document.write(html);
  document.close();
  return salt;
}
async function boot() {
  const res = await fetch("./payload.enc", { cache: "no-store" });
  if (!res.ok) throw new Error("没有加密包");
  const raw = new Uint8Array(await res.arrayBuffer());
  const saved = sessionStorage.getItem(STORE);
  if (saved) {
    try {
      const key = await crypto.subtle.importKey("raw", unb64(saved), "AES-GCM", false, ["decrypt"]);
      await openWithKey(raw, key);
      return;
    } catch (err) {
      sessionStorage.removeItem(STORE);
    }
  }
  document.getElementById("gate").addEventListener("submit", async (event) => {
    event.preventDefault();
    const msg = document.getElementById("msg");
    msg.textContent = "正在打开…";
    try {
      const key = await derive(document.getElementById("pass").value, raw.slice(0, 16));
      await openWithKey(raw, key);
    } catch (err) {
      msg.textContent = "口令不对";
    }
  });
}
boot().catch(err => { document.getElementById("msg").textContent = String(err.message || err); });
</script>
</body>
</html>
